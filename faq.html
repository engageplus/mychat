<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="logo-icon.png">
<title>よくある質問｜EngagePlus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--ink:#f3eee2;--sub:#9d9788;--line:#2b2924;--card:#151513;--accent:#d9b66f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.85}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
header img{width:32px;height:32px}
header b{font-size:16px}
header a.o{margin-left:auto;color:var(--accent);font-size:13px;text-decoration:none;border:1px solid var(--accent);padding:5px 12px;border-radius:16px;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:22px;margin:0 0 6px}
.d{color:var(--sub);font-size:12px;margin:0 0 24px}
h2{font-size:16px;margin:30px 0 8px;padding-left:10px;border-left:3px solid var(--accent)}
p,li{margin:6px 0}
h3{font-size:14.5px;margin:20px 0 4px;color:var(--accent)}
h2.part{font-size:19px;margin:52px 0 6px;padding:14px 0 0;border-left:0;border-top:1px solid var(--line)}
h2,h3{scroll-margin-top:12px}
ul,ol{padding-left:22px}
a{color:var(--accent)}
mark{background:rgba(217,182,111,.16);color:var(--accent);padding:0 4px;border-bottom:1px dashed var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid var(--line)}
th{width:34%;color:var(--sub);font-weight:500}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:0 14px}
summary{cursor:pointer;padding:13px 0;font-weight:500;list-style:none;display:flex;gap:10px}
summary::before{content:"Q";color:var(--accent);font-weight:700}
summary::-webkit-details-marker{display:none}
details p{margin:0 0 14px;padding-left:22px;color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:14px 0}
footer{border-top:1px solid var(--line);padding:20px 16px calc(24px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--sub)}
footer a{color:var(--sub);margin:0 8px;white-space:nowrap;display:inline-block;padding:4px 0}
</style>
</head>
<body>
<!-- 【公開前に】金色の点線で囲まれた <mark>…</mark> の部分が、あなたが記入・確認する箇所です。すべて書き換えてから公開してください。 -->

<div id="faq"></div>

<script>document.getElementById("faq").innerHTML=SITE.faq.map(function(x){return "<details><summary>"+SITE.plain(x.q)+"</summary><p>"+SITE.f(x.a)+"</p></details>";}).join("");</script>
</main>

</body>
</html>
