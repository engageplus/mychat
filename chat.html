<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サポートチャット</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #7494c0; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
    .chat-header { background: #333; color: #fff; padding: 15px; text-align: center; font-weight: bold; font-size: 16px; }
    .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-break: break-word; }
    .user-msg { align-self: flex-end; background: #85e249; color: #000; border-bottom-right-radius: 2px; }
    .admin-msg { align-self: flex-start; background: #ffffff; color: #000; border-bottom-left-radius: 2px; }
    .msg-img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
    .input-area { background: #fff; padding: 10px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #ddd; }
    textarea { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 16px; height: 45px; resize: none; outline: none; }
    .btn-send { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .file-label { cursor: pointer; font-size: 20px; padding: 5px; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<div class="chat-header">1対1 サポートチャット</div>
<div class="chat-container" id="chat-container"></div>

<div class="input-area">
  <label class="file-label">📷<input type="file" id="image-input" accept="image/*" onchange="sendFile(this)"></label>
  <textarea id="msg-input" placeholder="メッセージを入力..."></textarea>
  <button class="btn-send" onclick="sendMessage()">送信</button>
</div>

<script>
  // Firebase設定
  const firebaseConfig = {
    apiKey: "AIzaSyBxztcNsOe7b8tcMLY2J8pAMDU7NO28gZs",
    authDomain: "engageplus-c4ff2.firebaseapp.com",
    databaseURL: "https://engageplus-c4ff2-default-rtdb.firebaseio.com",
    projectId: "engageplus-c4ff2",
    storageBucket: "engageplus-c4ff2.firebasestorage.app",
    messagingSenderId: "771971030623",
    appId: "1:771971030623:web:dfc494457835d80f2f85ea",
    measurementId: "G-HMYKNE552W"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // URLパラメータ（?id=xxx）からユーザーIDを取得、無ければ自動生成して保存
  const urlParams = new URLSearchParams(window.location.search);
  let userId = urlParams.get('id');
  if (!userId) {
    userId = 'user_' + Math.random().toString(36).substring(2, 9);
    window.history.replaceState(null, null, '?id=' + userId);
  }

  const userChatRef = db.ref('chats/' + userId);

  // メッセージのリアルタイム受信
  userChatRef.on('child_added', (snapshot) => {
    const data = snapshot.val();
    const container = document.getElementById('chat-container');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message ' + (data.sender === 'user' ? 'user-msg' : 'admin-msg');

    if (data.type === 'text') {
      msgDiv.innerText = data.content;
    } else if (data.type === 'image') {
      const img = document.createElement('img');
      img.src = data.content;
      img.className = 'msg-img';
      msgDiv.appendChild(img);
    }

    container.appendChild(msgDiv);
    container.scrollTop = container.scrollHeight;
  });

  // テキスト送信
  function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;

    userChatRef.push({
      sender: 'user',
      type: 'text',
      content: text,
      timestamp: Date.now()
    });
    input.value = '';
  }

  // 画像送信
  function sendFile(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      userChatRef.push({
        sender: 'user',
        type: 'image',
        content: e.target.result,
        timestamp: Date.now()
      });
    };
    reader.readAsDataURL(file);
    input.value = '';
  }
</script>

</body>
</html>
