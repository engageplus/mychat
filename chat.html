<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="logo-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>EngagePlus サポートチャット</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--ink:#f3eee2;--sub:#9d9788;--line:#2b2924;--card:#151513;--accent:#d9b66f;--accent-ink:#0b0b0b;--warn:#e8895a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:640px;height:100%;height:var(--vh,100dvh);display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
header img{width:32px;height:32px}
header b{font-size:16px}
header a{margin-left:auto;color:var(--accent);font-size:13px;text-decoration:none;border:1px solid var(--accent);padding:5px 12px;border-radius:16px;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;object-fit:cover;flex:none}
header h1{font-size:15px;margin:0}
header small{color:var(--sub);font-size:12px}
.svc{padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.svc select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-direction:column;max-width:78%}
.row.user{align-self:flex-end;align-items:flex-end}
.row.admin{align-self:flex-start;align-items:flex-start}
.b{padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.user .b{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.admin .b{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.b img{max-width:100%;max-height:260px;border-radius:10px;display:block;cursor:zoom-in}
.b.img{padding:4px;background:var(--card);border:1px solid var(--line)}
.svc select option{background:var(--card)}
.t{font-size:11px;color:var(--sub);margin-top:3px}
.empty{margin:auto;text-align:center;color:var(--sub);font-size:14px;line-height:1.8}
form{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:120px;padding:10px 12px;border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;outline:none}
textarea:focus,select:focus{border-color:var(--accent)}
button{border:0;cursor:pointer;font:inherit}
.ic{width:40px;height:40px;border-radius:50%;background:transparent;color:var(--sub);font-size:20px;flex:none}
.send{height:40px;padding:0 18px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;flex:none}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:9}
#zoom img{max-width:94%;max-height:94%}

.nm{font-size:11px;color:var(--sub);margin:0 0 3px 4px}
.app.typing .op{display:none}
.op{max-height:34vh;overflow-y:auto;padding:12px 16px 2px;border-bottom:1px solid var(--line);background:var(--bg)}
.op-t{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:8px}
.op-t button{color:var(--accent);font-size:12px;text-decoration:underline;background:none}
.oc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.oc.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.oc .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.oc code{color:var(--accent);font-weight:700}
.oc .nt{font-size:12px;color:var(--sub);margin-top:3px;word-break:break-all}
.st{font-size:12px;padding:2px 10px;border-radius:12px;background:var(--line)}
.st.awaiting_payment{background:rgba(232,137,90,.2);color:var(--warn)}
.st.paid_reported,.st.working{background:rgba(217,182,111,.2);color:var(--accent)}
.st.done{background:rgba(123,196,143,.2);color:#7bc48f}
.pay{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
.pay ol{padding-left:20px;margin:6px 0}
.pay .row{display:flex;gap:8px;margin-top:8px}
.pay input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.go{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px;border-radius:20px;white-space:nowrap}
.perr{color:var(--warn);font-size:12px;min-height:16px;margin:4px 0 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="logo-icon.png" alt="">
    <b>EngagePlus</b>
    <a href="order.html">注文する</a>
  </header>
  <div class="op" id="op" hidden>
    <div class="op-t"><span>ご注文 <span id="opn"></span></span><button id="opb" type="button">隠す</button></div>
    <div id="ol"></div>
  </div>
  <div id="msgs"><div class="empty" id="empty">ご注文・ご質問はこちらからご連絡ください。<br>通常1〜2営業日以内にご返信します。</div></div>
  <form id="f">
    <button type="button" class="ic" id="pick" aria-label="画像を送る">🖼</button>
    <input type="file" id="file" accept="image/*" hidden>
    <textarea id="in" rows="1" placeholder="メッセージを入力" aria-label="メッセージ"></textarea>
    <button class="send" id="send">送信</button>
  </form>
</div>
<div id="zoom"><img alt=""></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ===== 設定 =====
const LIFF_ID = "";          // LINE Login 連携時に LIFF ID を設定（空なら匿名ユーザー）
const MAX_IMG = 900;         // 画像の長辺(px)。Base64肥大化を防ぐため縮小して送信
firebase.initializeApp({
  apiKey:"AIzaSyBxztcNsOe7b8tcMLY2J8pAMDU7NO28gZs",
  authDomain:"engageplus-c4ff2.firebaseapp.com",
  databaseURL:"https://engageplus-c4ff2-default-rtdb.firebaseio.com",
  projectId:"engageplus-c4ff2",
  storageBucket:"engageplus-c4ff2.firebasestorage.app",
  messagingSenderId:"771971030623",
  appId:"1:771971030623:web:dfc494457835d80f2f85ea"
});
const db = firebase.database();
const $ = id => document.getElementById(id);
const msgsEl = $("msgs");
let uid, profile = {name:"お客様", picture:""};

async function identify(){
  if (LIFF_ID && window.liff) {
    try {
      await liff.init({liffId:LIFF_ID});
      if (!liff.isLoggedIn()) { liff.login(); return false; }
      const p = await liff.getProfile();
      uid = "user_" + p.userId;
      profile = {name:p.displayName, picture:p.pictureUrl || ""};
      return true;
    } catch(e){ console.warn("LIFF失敗。匿名で続行", e); }
  }
  uid = localStorage.getItem("chat_uid");
  if (!uid) { uid = "user_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); localStorage.setItem("chat_uid", uid); }
  return true;
}

function fmt(ts){ const d = new Date(ts); return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"); }
function scrollEnd(){ msgsEl.scrollTop = msgsEl.scrollHeight; }

function render(m){
  $("empty")?.remove();
  const row = document.createElement("div");
  row.className = "row " + (m.sender === "admin" ? "admin" : "user");
  const b = document.createElement("div");
  if (m.type === "image" && /^data:image\//.test(m.content)) {
    b.className = "b img";
    const img = new Image(); img.alt = "送信画像"; img.src = m.content;
    img.onload = scrollEnd;
    img.onclick = () => { $("zoom").firstElementChild.src = m.content; $("zoom").style.display = "grid"; };
    b.appendChild(img);
  } else {
    b.className = "b";
    if (m.service) { const s = document.createElement("div"); s.style.cssText="font-size:12px;opacity:.8;margin-bottom:3px"; s.textContent = "【" + m.service + "】"; b.appendChild(s); }
    b.appendChild(document.createTextNode(m.content || ""));
  }
  const t = document.createElement("div"); t.className = "t"; t.textContent = fmt(m.timestamp);
  if (m.sender === "admin") { const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = "EngagePlus 運営"; row.append(nm, b, t); }
  else row.append(b, t);
  msgsEl.appendChild(row); scrollEnd();
}

function push(msg, preview){
  const ts = Date.now();
  const full = {...msg, sender:"user", timestamp:ts};
  const svc = "";
  if (svc && msg.type === "text") full.service = svc;
  db.ref("chats/" + uid).push(full);
  db.ref("users/" + uid).update({
    name:profile.name, picture:profile.picture, service:svc,
    lastMessage:preview, lastAt:ts, lastSender:"user"
  });
}

function sendText(){
  const v = $("in").value.trim();
  if (!v) return;
  push({type:"text", content:v}, v.slice(0,60));
  $("in").value = ""; $("in").style.height = "auto";
}

function resizeImage(file){
  return new Promise((ok, ng) => {
    const r = new FileReader();
    r.onerror = ng;
    r.onload = () => {
      const img = new Image();
      img.onerror = ng;
      img.onload = () => {
        const k = Math.min(1, MAX_IMG / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", 0.75));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

$("f").addEventListener("submit", e => { e.preventDefault(); sendText(); });
$("in").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendText(); } });
$("in").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight,120) + "px"; });
$("pick").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try { push({type:"image", content: await resizeImage(f)}, "[画像]"); }
  catch { alert("画像を読み込めませんでした。別の画像でお試しください。"); }
};
$("zoom").onclick = () => $("zoom").style.display = "none";

const PAY_RE = /^https:\/\/([a-z0-9-]+\.)?paypay\.ne\.jp\/\S+$/i;
const STATUS = {awaiting_payment:"お支払い待ち", paid_reported:"入金確認中", working:"作業中", done:"完了", canceled:"キャンセル"};
const yen = n => "¥" + n.toLocaleString("ja-JP");
const placed = new URLSearchParams(location.search).get("o");
let orders = {};
const appEl = document.querySelector(".app");
$("in").addEventListener("focus", () => appEl.classList.add("typing"));
$("in").addEventListener("blur", () => appEl.classList.remove("typing"));
// スマホのキーボード表示時に画面が隠れないよう、見えている高さに合わせる
if (window.visualViewport) { const fit = () => { document.documentElement.style.setProperty("--vh", visualViewport.height + "px"); window.scrollTo(0, 0); }; visualViewport.addEventListener("resize", fit); visualViewport.addEventListener("scroll", fit); fit(); }


function card(o){
  const c = document.createElement("div"); c.className = "oc" + (o.id === placed ? " new" : "");
  const h = document.createElement("div"); h.className = "h";
  const code = document.createElement("code"); code.textContent = o.id;
  const st = document.createElement("span"); st.className = "st " + o.status; st.textContent = STATUS[o.status] || o.status;
  h.append(code, st);
  const d = document.createElement("div"); d.style.marginTop = "4px";
  d.textContent = `${o.platform} ${o.service}${o.plan ? "（" + o.plan + "）" : ""} ${o.qty.toLocaleString()}${o.unit} ／ ${yen(o.total)}`;
  const n = document.createElement("div"); n.className = "nt"; n.textContent = "対象: " + o.account;
  c.append(h, d, n);
  if (o.status === "awaiting_payment") {
    const p = document.createElement("div"); p.className = "pay";
    const a = document.createElement("a"); a.className = "go"; a.href = "order.html?pay=" + encodeURIComponent(o.id); a.textContent = "お支払い手続きへ"; a.style.cssText = "display:inline-block;text-decoration:none;margin-top:6px";
    p.append("お支払いがまだ完了していません。", document.createElement("br"), a); c.appendChild(p);
  } else if (o.status === "paid_reported") {
    const p = document.createElement("div"); p.className = "pay"; p.textContent = "リンクを受け取りました。入金を確認でき次第、作業を開始します。進捗はこの画面とチャットでお知らせします。"; c.appendChild(p);
  }
  return c;
}
function drawOrders(){
  const list = Object.values(orders).sort((a,b) => b.createdAt - a.createdAt);
  $("op").hidden = !list.length;
  $("opn").textContent = list.length ? "(" + list.length + ")" : "";
  $("ol").replaceChildren(...list.map(card));
}
$("opb").onclick = () => { const h = $("ol").hidden = !$("ol").hidden; $("opb").textContent = h ? "表示" : "隠す"; };

(async () => {
  if (!await identify()) return;
  
  db.ref("orders/" + uid).on("value", s => {
    const a = document.activeElement;
    if (a && a.tagName === "INPUT" && $("ol").contains(a)) return;
    orders = s.val() || {}; drawOrders();
  });
  db.ref("chats/" + uid).orderByChild("timestamp").on("child_added", s => render(s.val()));
})();
</script>
</body>
</html>
