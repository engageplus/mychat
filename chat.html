<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNSマーケティング・サポートデスク</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; height: 100vh; }
    
    .chat-wrapper { width: 100%; max-width: 480px; background: #ffffff; display: flex; flex-direction: column; height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
    
    /* ヘッダーデザイン */
    .chat-header { background: #1e293b; color: #ffffff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #334155; }
    .status-avatar { width: 40px; height: 40px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
    .header-info { display: flex; flex-direction: column; }
    .header-title { font-size: 16px; font-weight: 700; }
    .header-status { font-size: 12px; color: #34d399; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 8px; height: 8px; background: #34d399; border-radius: 50%; }

    /* チャット表示エリア */
    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; scroll-behavior: smooth; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .user-msg { align-self: flex-end; background: #2563eb; color: #ffffff; border-bottom-right-radius: 4px; }
    .admin-msg { align-self: flex-start; background: #ffffff; color: #0f172a; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
    .msg-img { max-width: 100%; border-radius: 10px; margin-top: 6px; }

    /* 入力・注文エリア */
    .input-wrapper { background: #ffffff; border-top: 1px solid #e2e8f0; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .service-select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 13px; background: #f1f5f9; color: #334155; outline: none; }
    .input-box { display: flex; gap: 8px; align-items: center; }
    textarea { flex: 1; border: 1px solid #cbd5e1; border-radius: 20px; padding: 10px 16px; font-size: 14px; height: 42px; resize: none; outline: none; font-family: inherit; }
    textarea:focus { border-color: #2563eb; }
    .btn-send { background: #2563eb; color: #ffffff; border: none; padding: 0 18px; height: 42px; border-radius: 20px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; }
    .btn-send:hover { background: #1d4ed8; }
    .file-btn { cursor: pointer; font-size: 20px; padding: 0 6px; color: #64748b; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<div class="chat-wrapper">
  <!-- ヘッダー -->
  <div class="chat-header">
    <div class="status-avatar">S</div>
    <div class="header-info">
      <div class="header-title">SNS Grow Support</div>
      <div class="header-status"><span class="status-dot"></span> オンライン（即時対応中）</div>
    </div>
  </div>

  <!-- メッセージ表示部 -->
  <div class="chat-container" id="chat-container"></div>

  <!-- 入力部 -->
  <div class="input-wrapper">
    <select class="service-select" id="service-select">
      <option value="">▼ ご希望のサービス・ご相談内容を選択</option>
      <option value="【質問・事前相談】">【質問・事前相談】</option>
      <option value="【注文】Instagram フォロワー増加">【注文】Instagram フォロワー増加</option>
      <option value="【注文】TikTok フォロワー / 再生数増加">【注文】TikTok フォロワー / 再生数増加</option>
      <option value="【注文】X(Twitter) フォロワー / いいね増加">【注文】X(Twitter) フォロワー / いいね増加</option>
      <option value="【注文】YouTube チャンネル登録者増加">【注文】YouTube チャンネル登録者増加</option>
    </select>

    <div class="input-box">
      <label class="file-btn" title="画像を送信">📷<input type="file" id="image-input" accept="image/*" onchange="sendFile(this)"></label>
      <textarea id="msg-input" placeholder="メッセージを入力..."></textarea>
      <button class="btn-send" onclick="sendMessage()">送信</button>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBxztcNsOe7b8tcMLY2J8pAMDU7NO28gZs",
    authDomain: "engageplus-c4ff2.firebaseapp.com",
    databaseURL: "https://engageplus-c4ff2-default-rtdb.firebaseio.com",
    projectId: "engageplus-c4ff2",
    storageBucket: "engageplus-c4ff2.firebasestorage.app",
    messagingSenderId: "771971030623",
    appId: "1:771971030623:web:dfc494457835d80f2f85ea",
    measurementId: "G-HMYKNE552W"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const urlParams = new URLSearchParams(window.location.search);
  let userId = urlParams.get('id');
  if (!userId) {
    userId = 'user_' + Math.random().toString(36).substring(2, 9);
    window.history.replaceState(null, null, '?id=' + userId);
  }

  const userChatRef = db.ref('chats/' + userId);
  const container = document.getElementById('chat-container');

  // 最下部へスクロールする関数
  function scrollToBottom() {
    setTimeout(() => {
      container.scrollTop = container.scrollHeight;
    }, 50);
  }

  // メッセージのリアルタイム受信
  userChatRef.on('child_added', (snapshot) => {
    const data = snapshot.val();
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message ' + (data.sender === 'user' ? 'user-msg' : 'admin-msg');

    if (data.type === 'text') {
      msgDiv.innerText = data.content;
      container.appendChild(msgDiv);
      scrollToBottom();
    } else if (data.type === 'image') {
      const img = document.createElement('img');
      img.src = data.content;
      img.className = 'msg-img';
      // 画像読み込み完了後に最下部へスクロール
      img.onload = () => scrollToBottom();
      msgDiv.appendChild(img);
      container.appendChild(msgDiv);
      scrollToBottom();
    }
  });

  function sendMessage() {
    const input = document.getElementById('msg-input');
    const serviceSelect = document.getElementById('service-select');
    let text = input.value.trim();
    
    if (serviceSelect.value) {
      text = serviceSelect.value + "\n" + text;
      serviceSelect.value = "";
    }

    if (!text) return;

    userChatRef.push({
      sender: 'user',
      type: 'text',
      content: text,
      timestamp: Date.now()
    });
    input.value = '';
  }

  function sendFile(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      userChatRef.push({
        sender: 'user',
        type: 'image',
        content: e.target.result,
        timestamp: Date.now()
      });
    };
    reader.readAsDataURL(file);
    input.value = '';
  }
</script>

</body>
</html>
