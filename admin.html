<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャット管理画面</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    
    /* パスワード保護用オーバーレイ */
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 9999;
    }
    .login-box {
      background: #ffffff; padding: 30px; border-radius: 12px; width: 320px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .login-box h2 { font-size: 18px; margin-bottom: 15px; color: #1e293b; }
    .login-box input {
      width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1;
      border-radius: 6px; font-size: 16px; text-align: center; outline: none;
    }
    .login-box input:focus { border-color: #2563eb; }
    .login-box button {
      width: 100%; padding: 10px; background: #2563eb; color: #ffffff; border: none;
      border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer;
    }
    .login-box button:hover { background: #1d4ed8; }
    #login-error { color: #ef4444; font-size: 12px; margin-top: 10px; display: none; }

    /* 管理画面メインレイアウト */
    #user-list { width: 260px; border-right: 1px solid #e2e8f0; overflow-y: auto; background: #f8fafc; }
    .user-item { padding: 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 14px; font-weight: 600; word-break: break-all; color: #334155; }
    .user-item:hover { background: #e2e8f0; }
    .user-item.active { background: #2563eb; color: #ffffff; }
    
    #chat-area { flex: 1; display: flex; flex-direction: column; background: #f1f5f9; }
    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .user-msg { align-self: flex-start; background: #ffffff; color: #0f172a; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .admin-msg { align-self: flex-end; background: #2563eb; color: #ffffff; border-bottom-right-radius: 2px; }
    .msg-img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
    
    .input-area { background: #ffffff; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #e2e8f0; }
    textarea { flex: 1; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; font-size: 14px; height: 45px; resize: none; outline: none; font-family: inherit; }
    textarea:focus { border-color: #2563eb; }
    button.send-btn { background: #2563eb; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button.send-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<!-- パスワード保護オーバーレイ -->
<div id="login-overlay">
  <div class="login-box">
    <h2>管理者ログイン</h2>
    <input type="password" id="pass-input" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter') checkPassword()">
    <button onclick="checkPassword()">ログイン</button>
    <div id="login-error">パスワードが違います</div>
  </div>
</div>

<!-- 管理画面本体 -->
<div id="user-list">
  <div style="padding: 15px; font-size: 12px; color: #64748b; text-align: center;">ユーザー読み込み中...</div>
</div>
<div id="chat-area">
  <div class="chat-container" id="chat-container">
    <div style="text-align: center; color: #64748b; margin-top: 20px; font-size: 14px;">左側のリストからお客様を選択してください</div>
  </div>
  <div class="input-area">
    <textarea id="msg-input" placeholder="返答を入力..."></textarea>
    <button class="send-btn" onclick="sendReply()">送信</button>
  </div>
</div>

<script>
  // ★設定1: 管理画面のログインパスワード（好きな文字列に変更してください）
  const ADMIN_PASSWORD = "1441sh16";

  // パスワード認証チェック
  function checkPassword() {
    const inputPass = document.getElementById('pass-input').value;
    if (inputPass === ADMIN_PASSWORD) {
      sessionStorage.setItem('admin_auth', 'true');
      document.getElementById('login-overlay').style.display = 'none';
      initAdminApp();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  }

  // すでにログイン済みか確認
  window.onload = function() {
    if (sessionStorage.getItem('admin_auth') === 'true') {
      document.getElementById('login-overlay').style.display = 'none';
      initAdminApp();
    }
  };

  // Firebase初期化 & アプリ起動
  function initAdminApp() {
    const firebaseConfig = {
      apiKey: "AIzaSyBxztcNsOe7b8tcMLY2J8pAMDU7NO28gZs",
      authDomain: "engageplus-c4ff2.firebaseapp.com",
      databaseURL: "https://engageplus-c4ff2-default-rtdb.firebaseio.com",
      projectId: "engageplus-c4ff2",
      storageBucket: "engageplus-c4ff2.firebasestorage.app",
      messagingSenderId: "771971030623",
      appId: "1:771971030623:web:dfc494457835d80f2f85ea",
      measurementId: "G-HMYKNE552W"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    
    const db = firebase.database();
    let currentUserId = null;
    const container = document.getElementById('chat-container');

    function scrollToBottom() {
      setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
    }

    // ユーザー一覧の取得
    db.ref('chats').on('value', (snapshot) => {
      const listDiv = document.getElementById('user-list');
      listDiv.innerHTML = '';
      
      if (!snapshot.exists()) {
        listDiv.innerHTML = '<div style="padding: 15px; font-size: 12px; color: #64748b; text-align: center;">まだメッセージはありません</div>';
        return;
      }

      snapshot.forEach((child) => {
        const uId = child.key;
        const item = document.createElement('div');
        item.className = 'user-item ' + (uId === currentUserId ? 'active' : '');
        item.innerText = uId;
        item.onclick = () => selectUser(uId);
        listDiv.appendChild(item);
      });
    });

    // ユーザー選択
    window.selectUser = function(uId) {
      currentUserId = uId;
      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
      
      container.innerHTML = '';

      db.ref('chats/' + uId).off();
      db.ref('chats/' + uId).on('child_added', (snapshot) => {
        const data = snapshot.val();
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + (data.sender === 'user' ? 'user-msg' : 'admin-msg');

        if (data.type === 'text') {
          msgDiv.innerText = data.content;
          container.appendChild(msgDiv);
          scrollToBottom();
        } else if (data.type === 'image') {
          const img = document.createElement('img');
          img.src = data.content;
          img.className = 'msg-img';
          img.onload = () => scrollToBottom();
          msgDiv.appendChild(img);
          container.appendChild(msgDiv);
          scrollToBottom();
        }
      });
    };

    // 返信送信
    window.sendReply = function() {
      if (!currentUserId) {
        alert('左側のリストからユーザーを選択してください');
        return;
      }
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      db.ref('chats/' + currentUserId).push({
        sender: 'admin',
        type: 'text',
        content: text,
        timestamp: Date.now()
      });
      input.value = '';
    };
  }
</script>

</body>
</html>
