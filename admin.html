<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャット管理画面</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; height: 100vh; }
    #user-list { width: 220px; border-right: 1px solid #ccc; overflow-y: auto; background: #f8f9fa; }
    .user-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; font-weight: bold; word-break: break-all; }
    .user-item.active { background: #e2e6ea; color: #007bff; }
    #chat-area { flex: 1; display: flex; flex-direction: column; background: #7494c0; }
    .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 15px; word-break: break-word; }
    .user-msg { align-self: flex-start; background: #ffffff; color: #000; border-bottom-left-radius: 2px; }
    .admin-msg { align-self: flex-end; background: #85e249; color: #000; border-bottom-right-radius: 2px; }
    .msg-img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
    .input-area { background: #fff; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #ddd; }
    textarea { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 16px; height: 45px; resize: none; outline: none; }
    button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div id="user-list">
  <div style="padding: 15px; font-size: 12px; color: #666; text-align: center;">ユーザー読み込み中...</div>
</div>
<div id="chat-area">
  <div class="chat-container" id="chat-container">
    <div style="text-align: center; color: #fff; margin-top: 20px; font-size: 14px;">左側のリストからお客様を選択してください</div>
  </div>
  <div class="input-area">
    <textarea id="msg-input" placeholder="返答を入力..."></textarea>
    <button onclick="sendReply()">送信</button>
  </div>
</div>

<script>
  // ★ここをご自身のFirebase設定に書き換えてください★
  const firebaseConfig = {
    apiKey: "AIzaSyBxztcNsOe7b8tcMLY2J8pAMDU7NO28gZs",
    authDomain: "engageplus-c4ff2.firebaseapp.com",
    databaseURL: "https://engageplus-c4ff2-default-rtdb.firebaseio.com",
    projectId: "engageplus-c4ff2",
    storageBucket: "engageplus-c4ff2.firebasestorage.app",
    messagingSenderId: "771971030623",
    appId: "1:771971030623:web:dfc494457835d80f2f85ea",
    measurementId: "G-HMYKNE552W"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let currentUserId = null;

  // ユーザー一覧の取得
  db.ref('chats').on('value', (snapshot) => {
    const listDiv = document.getElementById('user-list');
    listDiv.innerHTML = '';
    
    if (!snapshot.exists()) {
      listDiv.innerHTML = '<div style="padding: 15px; font-size: 12px; color: #666; text-align: center;">まだメッセージはありません</div>';
      return;
    }

    snapshot.forEach((child) => {
      const uId = child.key;
      const item = document.createElement('div');
      item.className = 'user-item ' + (uId === currentUserId ? 'active' : '');
      item.innerText = uId;
      item.onclick = () => selectUser(uId);
      listDiv.appendChild(item);
    });
  });

  // ユーザー選択
  function selectUser(uId) {
    currentUserId = uId;
    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
    
    const container = document.getElementById('chat-container');
    container.innerHTML = '';

    db.ref('chats/' + uId).off();
    db.ref('chats/' + uId).on('child_added', (snapshot) => {
      const data = snapshot.val();
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ' + (data.sender === 'user' ? 'user-msg' : 'admin-msg');

      if (data.type === 'text') {
        msgDiv.innerText = data.content;
      } else if (data.type === 'image') {
        const img = document.createElement('img');
        img.src = data.content;
        img.className = 'msg-img';
        msgDiv.appendChild(img);
      }

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    });
  }

  // 返信送信
  function sendReply() {
    if (!currentUserId) {
      alert('左側のリストからユーザーを選択してください');
      return;
    }
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;

    db.ref('chats/' + currentUserId).push({
      sender: 'admin',
      type: 'text',
      content: text,
      timestamp: Date.now()
    });
    input.value = '';
  }
</script>

</body>
</html>
